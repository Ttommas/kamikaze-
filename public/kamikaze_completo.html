      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;

    // --- SUB-COMPONENT: ENROLLMENT & CHECKOUT MODAL ---
    function EnrollmentCheckoutModal({ workshop, walletConfig, currentUser, onClose, onSuccess }) {
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        name: currentUser?.name || '',
        email: currentUser?.email || '',
        phone: currentUser?.phone || '',
        doc: currentUser?.doc || '',
        isMember: currentUser?.isMember || false
      });
      const [paymentOption, setPaymentOption] = useState('total');
      const [paymentMethod, setPaymentMethod] = useState('mercadopago');
      const [receiptName, setReceiptName] = useState('');
      const [ticketPass, setTicketPass] = useState(null);

      const finalAmount = formData.isMember ? workshop.memberPrice : workshop.price;
      const amountToPay = paymentOption === 'seña_50' ? Math.round(finalAmount / 2) : finalAmount;

      const handleStep1 = (e) => {
        e.preventDefault();
        setStep(2);
      };

      const handleConfirmPayment = () => {
        const passCode = 'KMKZ-2026-' + Math.random().toString(36).substring(2, 7).toUpperCase();
        const newEnrollment = {
          id: 'enr-' + Date.now(),
          workshopId: workshop.id,
          workshopTitle: workshop.title,
          studentName: formData.name,
          studentEmail: formData.email,
          studentPhone: formData.phone,
          studentDoc: formData.doc,
          isMember: formData.isMember,
          paymentOption,
          amountPaid: amountToPay,
          totalAmount: finalAmount,
          paymentMethod,
          paymentStatus: 'pendiente_verificacion',
          receiptUrl: receiptName ? 'comprobante_subido.jpg' : undefined,
          passCode,
          createdAt: new Date().toISOString()
        };

        setTicketPass(newEnrollment);
        setStep(3);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">

                  PASO {step} DE 3

                  Inscripción: {workshop.title}

                <Icon name="close" className="w-5 h-5" />

            {/* STEP 1: PARTICIPANT DATA */}
            {step === 1 && (
              <form onSubmit={handleStep1} className="space-y-4">
                <h4 className="font-mono text-sm font-bold uppercase">1. Datos del participante</h4>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-mono font-bold block mb-1">Nombre Completo *</label>
                    <input
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder="Ej: Sofía Almada"
                      className="w-full p-2.5 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                    />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-mono font-bold block mb-1">Email *</label>
                      <input
                        required
                        type="email"
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        placeholder="tu@email.com"
                        className="w-full p-2.5 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-mono font-bold block mb-1">WhatsApp / Teléfono *</label>
                      <input
                        required
                        value={formData.phone}
                        onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                        placeholder="+54 9 11 ..."
                        className="w-full p-2.5 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-mono font-bold block mb-1">DNI / Pasaporte *</label>
                    <input
                      required
                      value={formData.doc}
                      onChange={(e) => setFormData({ ...formData, doc: e.target.value })}
                      placeholder="Para seguro y registro en sede"
                      className="w-full p-2.5 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                    />
                  </div>
                  <label className="flex items-center gap-2 text-xs font-mono p-3 bg-[#f0c510] border border-[#E52E33]/50 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={formData.isMember}
                      onChange={(e) => setFormData({ ...formData, isMember: e.target.checked })}
                      className="w-4 h-4 accent-[#E52E33]"
                    />
                    <span>Soy socix / estudiante recurrente de Kamikaze (aplica descuento)</span>
                  </label>
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-[#E52E33]">
                  <div className="text-sm font-mono font-bold">
                    Arancel: ${finalAmount.toLocaleString('es-AR')}
                  </div>
                  <button type="submit" className="btn-brand-inverse px-6 py-2.5 text-xs font-mono uppercase font-bold">
                    Continuar al Pago →
                  </button>
                </div>
              </form>
            )}

            {/* STEP 2: PAYMENT METHOD & WALLET */}
            {step === 2 && (
              <div className="space-y-4">
                <h4 className="font-mono text-sm font-bold uppercase">2. Selección de Pago & Billetera</h4>
                
                {/* Total vs Seña */}
                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={() => setPaymentOption('total')}
                    className={`p-3 border text-left font-mono text-xs ${
                      paymentOption === 'total' ? 'bg-[#E52E33] text-[#FFD41D] border-[#E52E33]' : 'bg-[#f0c510] border-[#E52E33]/60'
                    }`}
                  >
                    <div className="font-bold">Pago Total 100%</div>
                    <div className="text-sm font-bold mt-1">${finalAmount.toLocaleString('es-AR')}</div>
                  </button>

                  <button
                    type="button"
                    onClick={() => setPaymentOption('seña_50')}
                    className={`p-3 border text-left font-mono text-xs ${
                      paymentOption === 'seña_50' ? 'bg-[#E52E33] text-[#FFD41D] border-[#E52E33]' : 'bg-[#f0c510] border-[#E52E33]/60'
                    }`}
                  >
                    <div className="font-bold">Seña 50% (Reserva)</div>
                    <div className="text-sm font-bold mt-1">${Math.round(finalAmount/2).toLocaleString('es-AR')}</div>
                  </button>
                </div>

                {/* Methods */}
                <div className="space-y-2">
                  <label className="text-xs font-mono font-bold block">Medio de pago:</label>
                  <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                    {['mercadopago', 'transferencia', 'efectivo_sede', 'beca'].map((m) => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => setPaymentMethod(m)}
                        className={`p-2.5 border uppercase font-bold text-center ${
                          paymentMethod === m ? 'bg-[#E52E33] text-[#FFD41D] border-[#E52E33]' : 'bg-[#f0c510] border-[#E52E33]/40'
                        }`}
                      >
                        {m.replace('_', ' ')}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Data to transfer */}
                <div className="p-4 bg-[#f0c510] border border-[#E52E33] space-y-2 text-xs font-mono">
                  <div className="font-bold uppercase text-[#E52E33]">[ Transferir a cuenta oficial ]</div>
                  <div><strong>Titular:</strong> {walletConfig.accountHolder}</div>
                  <div><strong>Alias MP:</strong> <span className="bg-[#FFD41D] px-1 py-0.5 font-bold">{walletConfig.mpAlias}</span></div>
                  <div><strong>CVU:</strong> {walletConfig.mpCvu}</div>
                  <div><strong>Monto a transferir:</strong> <span className="font-bold">${amountToPay.toLocaleString('es-AR')}</span></div>
                </div>

                {/* Simulated file uploader */}
                <div className="p-3 bg-[#f0c510] border border-dashed border-[#E52E33] text-center space-y-1">
                  <label className="text-xs font-mono cursor-pointer block">
                    <span className="font-bold underline">Adjuntar Comprobante de Pago</span>
                    <input
                      type="file"
                      className="hidden"
                      onChange={(e) => {
                        if (e.target.files && e.target.files[0]) {
                          setReceiptName(e.target.files[0].name);
                        }
                      }}
                    />
                  </label>
                  {receiptName ? (
                    <div className="text-[11px] font-mono font-bold text-green-800">
                      ✓ Archivo cargado: {receiptName}
                    </div>
                  ) : (
                    <div className="text-[10px] opacity-70">PNG, JPG o PDF de la transferencia</div>
                  )}
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-[#E52E33]">
                  <button onClick={() => setStep(1)} className="text-xs font-mono underline font-bold">
                    ← Volver a datos
                  </button>
                  <button
                    onClick={handleConfirmPayment}
                    className="btn-brand-inverse px-6 py-2.5 text-xs font-mono uppercase font-bold"
                  >
                    Confirmar & Generar Pase QR →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 3: TICKET & QR CONFIRMATION */}
            {step === 3 && ticketPass && (
              <div className="space-y-6 text-center">
                <div className="w-12 h-12 rounded-full bg-[#E52E33] text-[#FFD41D] mx-auto flex items-center justify-center">
                  <Icon name="check" className="w-6 h-6" />
                </div>
                <div>
                  <h4 className="text-2xl font-bold brand-title">¡Reserva Registrada!</h4>
                  <p className="text-xs opacity-90 mt-1">
                    Tu pase digital ha sido emitido. Presentalo al ingresar a la primera clase.
                  </p>
                </div>

                {/* TICKET PASS */}
                <div className="p-6 bg-[#f0c510] border-2 border-[#E52E33] space-y-4 text-left font-mono">
                  <div className="flex justify-between items-start border-b border-[#E52E33]/40 pb-2">
                    <div>
                      <div className="text-[10px] opacity-70">CÓDIGO DE ACCESO</div>
                      <div className="text-lg font-bold text-[#E52E33]">{ticketPass.passCode}</div>
                    </div>
                    <span className="text-[10px] bg-[#E52E33] text-[#FFD41D] px-2 py-0.5 font-bold">
                      TALLER OFICIAL
                    </span>
                  </div>

                  <div className="text-xs space-y-1">
                    <div><strong>Participante:</strong> {ticketPass.studentName}</div>
                    <div><strong>Taller:</strong> {ticketPass.workshopTitle}</div>
                    <div><strong>Monto Registrado:</strong> ${ticketPass.amountPaid.toLocaleString('es-AR')} ({ticketPass.paymentOption})</div>
                    <div><strong>Estado:</strong> Pendiente de Acreditación</div>
                  </div>

                  <div className="pt-2 flex items-center justify-center p-3 bg-white text-black border border-black/30">
                    <div className="text-center font-mono text-[10px]">
                      <div className="font-bold">[ QR VALIDATION TOKEN ]</div>
                      <div className="text-xs font-mono tracking-widest mt-1">{ticketPass.passCode}</div>
                    </div>
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row gap-3">
                  <button
                    onClick={() => {
                      onSuccess(ticketPass);
                    }}
                    className="btn-brand-inverse flex-1 py-3 text-xs font-mono uppercase font-bold"
                  >
                    Guardar & Ver en Mi Portal
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

                  ) : (
                    myEnrollments.map((enr) => (
                      <div key={enr.id} className="p-4 border border-[#E52E33] bg-[#f0c510] space-y-2 font-mono text-xs">
                        <div className="flex justify-between items-start">
                          <span className="font-bold text-sm text-[#E52E33]">{enr.workshopTitle}</span>
                          <span className="bg-[#E52E33] text-[#FFD41D] px-1.5 py-0.5 text-[10px] font-bold uppercase">
                            {enr.paymentStatus.replace('_', ' ')}
                          </span>
                        </div>
                        <div className="grid grid-cols-2 gap-2 text-[11px] opacity-90">
                          <div><strong>Pase QR:</strong> {enr.passCode}</div>
                          <div><strong>Monto:</strong> ${enr.amountPaid.toLocaleString('es-AR')}</div>
                          <div><strong>Fecha:</strong> {new Date(enr.createdAt).toLocaleDateString('es-AR')}</div>
                          <div><strong>Modalidad:</strong> {enr.paymentOption}</div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // --- SUB-COMPONENT: ADMIN PANEL ---
    function AdminPanelView({ workshops, enrollments, walletConfig, bitacoraVideo, onClose, onUpdateWorkshops, onUpdateEnrollments, onUpdateWallet, onUpdateVideo }) {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [userField, setUserField] = useState('');
      const [passField, setPassField] = useState('');
      const [activeTab, setActiveTab] = useState('inscripciones');
      const [videoUrlInput, setVideoUrlInput] = useState(bitacoraVideo.youtubeUrl);
      const [videoTitleInput, setVideoTitleInput] = useState(bitacoraVideo.title);

      const handleLogin = (e) => {
        e.preventDefault();
        const validUsers = ['colectivokamizaze', 'colectivokamikaze', 'admin'];
        if (validUsers.includes(userField.toLowerCase().trim()) && passField === 'kamikaze2026') {
          setIsAuthenticated(true);
        } else {
          alert('Credenciales incorrectas. Usuario: colectivokamizaze / Pass: kamikaze2026');
        }
      };

      const handleUpdateStatus = (id, status) => {
        const updated = enrollments.map(e => e.id === id ? { ...e, paymentStatus: status } : e);
        onUpdateEnrollments(updated);
      };

      const exportCSV = () => {
        const rows = [
          ['ID', 'Taller', 'Participante', 'Email', 'Telefono', 'DNI', 'Monto', 'Estado', 'Pase QR', 'Fecha'],
          ...enrollments.map(e => [
            e.id, e.workshopTitle, e.studentName, e.studentEmail, e.studentPhone, e.studentDoc, e.amountPaid, e.paymentStatus, e.passCode, e.createdAt
          ])
        ];
        const csvContent = "data:text/csv;charset=utf-8," + rows.map(r => r.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `inscripciones_kamikaze_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-[#FFD41D] text-[#E52E33] border-2 border-[#E52E33] max-w-4xl w-full p-6 sm:p-8 space-y-6 max-h-[92vh] overflow-y-auto">
            
            <div className="flex justify-between items-start border-b border-[#E52E33]/40 pb-4">
              <div>
                <span className="text-xs font-mono uppercase bg-[#E52E33] text-[#FFD41D] px-2 py-0.5 font-bold">
                  GESTIÓN INTERNA
                </span>
                <h3 className="text-2xl sm:text-3xl font-bold brand-title mt-1">
                  Panel de Administración Colectivo
                </h3>
              </div>
              <button onClick={onClose} className="btn-brand p-1.5">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            {!isAuthenticated ? (
              <form onSubmit={handleLogin} className="max-w-sm mx-auto space-y-4 py-8">
                <div className="text-xs font-mono text-center opacity-80">
                  Ingreso exclusivo para integrantes de Kamikaze.
                </div>
                <input
                  required
                  placeholder="Usuario (colectivokamizaze)"
                  value={userField}
                  onChange={(e) => setUserField(e.target.value)}
                  className="w-full p-2.5 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                />
                <input
                  required
                  type="password"
                  placeholder="Contraseña (kamikaze2026)"
                  value={passField}
                  onChange={(e) => setPassField(e.target.value)}
                  className="w-full p-2.5 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                />
                <button type="submit" className="btn-brand-inverse w-full py-2.5 text-xs font-mono uppercase font-bold">
                  Ingresar al Sistema
                </button>
              </form>
            ) : (
              <div className="space-y-6">
                {/* Tabs */}
                <div className="flex flex-wrap gap-2 border-b border-[#E52E33] pb-2">
                  {['inscripciones', 'talleres', 'youtube', 'billetera'].map((t) => (
                    <button
                      key={t}
                      onClick={() => setActiveTab(t)}
                      className={`px-3 py-1.5 text-xs font-mono uppercase font-bold border border-[#E52E33] ${
                        activeTab === t ? 'bg-[#E52E33] text-[#FFD41D]' : 'bg-[#FFD41D]'
                      }`}
                    >
                      {t}
                    </button>
                  ))}
                </div>

                {/* TAB 1: INSCRIPCIONES */}
                {activeTab === 'inscripciones' && (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <div className="text-xs font-mono font-bold">
                        Total Inscriptos: {enrollments.length}
                      </div>
                      <button onClick={exportCSV} className="btn-brand px-3 py-1 text-xs font-mono uppercase font-bold flex items-center gap-1.5">
                        <Icon name="download" className="w-3.5 h-3.5" />
                        <span>Exportar CSV</span>
                      </button>
                    </div>

                    <div className="overflow-x-auto border border-[#E52E33]">
                      <table className="w-full text-left font-mono text-xs">
                        <thead className="bg-[#E52E33] text-[#FFD41D] uppercase">
                          <tr>
                            <th className="p-2">Participante</th>
                            <th className="p-2">Taller</th>
                            <th className="p-2">Monto</th>
                            <th className="p-2">Pase QR</th>
                            <th className="p-2">Estado</th>
                            <th className="p-2">Acción</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-[#E52E33]/30 bg-[#f0c510]">
                          {enrollments.length === 0 ? (
                            <tr><td colSpan="6" className="p-4 text-center">No hay inscripciones registradas.</td></tr>
                          ) : (
                            enrollments.map((enr) => (
                              <tr key={enr.id}>
                                <td className="p-2">
                                  <div className="font-bold">{enr.studentName}</div>
                                  <div className="text-[10px] opacity-75">{enr.studentEmail} · {enr.studentPhone}</div>
                                </td>
                                <td className="p-2">{enr.workshopTitle}</td>
                                <td className="p-2">${enr.amountPaid.toLocaleString('es-AR')}</td>
                                <td className="p-2 font-bold">{enr.passCode}</td>
                                <td className="p-2">
                                  <span className="px-1.5 py-0.5 bg-[#E52E33] text-[#FFD41D] text-[10px] font-bold">
                                    {enr.paymentStatus}
                                  </span>
                                </td>
                                <td className="p-2">
                                  <select
                                    value={enr.paymentStatus}
                                    onChange={(e) => handleUpdateStatus(enr.id, e.target.value)}
                                    className="p-1 text-[11px] bg-[#FFD41D] border border-[#E52E33] font-mono"
                                  >
                                    <option value="pendiente_verificacion">Pendiente</option>
                                    <option value="confirmado">Confirmado</option>
                                    <option value="seña_50">Seña 50%</option>
                                    <option value="cancelado">Cancelado</option>
                                  </select>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* TAB 2: TALLERES */}
                {activeTab === 'talleres' && (
                  <div className="space-y-4">
                    <div className="text-xs font-mono font-bold">Talleres Activos ({workshops.length})</div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {workshops.map((ws) => (
                        <div key={ws.id} className="p-4 border border-[#E52E33] bg-[#f0c510] space-y-2 text-xs font-mono">
                          <div className="flex justify-between">
                            <span className="font-bold text-sm">{ws.title}</span>
                            <span>{ws.availableSpots}/{ws.totalSpots} cupos</span>
                          </div>
                          <div>Arancel: ${ws.price.toLocaleString('es-AR')} | Socixs: ${ws.memberPrice.toLocaleString('es-AR')}</div>
                          <div>Docente: {ws.instructor}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 3: YOUTUBE BITACORA */}
                {activeTab === 'youtube' && (
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    onUpdateVideo({
                      ...bitacoraVideo,
                      youtubeUrl: videoUrlInput,
                      title: videoTitleInput
                    });
                    alert('¡Video de Bitácora actualizado en la Home!');
                  }} className="space-y-4 max-w-md">
                    <h4 className="font-mono text-xs uppercase font-bold">Cambiar Video de YouTube</h4>
                    <div>
                      <label className="text-xs font-mono font-bold block mb-1">Enlace de YouTube (Watch o Short):</label>
                      <input
                        required
                        value={videoUrlInput}
                        onChange={(e) => setVideoUrlInput(e.target.value)}
                        placeholder="https://www.youtube.com/watch?v=..."
                        className="w-full p-2 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-mono font-bold block mb-1">Título del Video:</label>
                      <input
                        required
                        value={videoTitleInput}
                        onChange={(e) => setVideoTitleInput(e.target.value)}
                        className="w-full p-2 border border-[#E52E33] bg-[#f0c510] text-xs font-mono"
                      />
                    </div>
                    <button type="submit" className="btn-brand-inverse px-4 py-2 text-xs font-mono uppercase font-bold">
                      Guardar Video en Bitácora
                    </button>
                  </form>
                )}

                {/* TAB 4: BILLETERA */}
                {activeTab === 'billetera' && (
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    alert('¡Configuración de billetera guardada!');
                  }} className="space-y-3 max-w-md text-xs font-mono">
                    <h4 className="font-mono text-xs uppercase font-bold">Configuración de Cobro</h4>
                    <div>
                      <label className="font-bold block mb-1">Alias Mercado Pago:</label>
                      <input
                        value={walletConfig.mpAlias}
                        onChange={(e) => onUpdateWallet({ ...walletConfig, mpAlias: e.target.value })}
                        className="w-full p-2 border border-[#E52E33] bg-[#f0c510]"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">CVU:</label>
                      <input
                        value={walletConfig.mpCvu}
                        onChange={(e) => onUpdateWallet({ ...walletConfig, mpCvu: e.target.value })}
                        className="w-full p-2 border border-[#E52E33] bg-[#f0c510]"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Email de Contacto:</label>
                      <input
                        value={walletConfig.contactEmail}
                        onChange={(e) => onUpdateWallet({ ...walletConfig, contactEmail: e.target.value })}
                        className="w-full p-2 border border-[#E52E33] bg-[#f0c510]"
                      />
                    </div>
                    <button type="submit" className="btn-brand-inverse px-4 py-2 text-xs font-mono uppercase font-bold mt-2">
                      Guardar Datos Billetera
                    </button>
                  </form>
                )}

              </div>
            )}

          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
